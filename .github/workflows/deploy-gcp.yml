name: Deploy GCP (low cost)

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test
        run: npm ci && npm test -- --test-timeout=30000 --test-concurrency=1 && node --check app.js
      - name: Validate configuration
        env:
          WIF: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          DEPLOY_SA: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID" && test -n "$GCP_REGION" && test -n "$TERRAFORM_STATE_BUCKET"
          test -n "$WIF" && test -n "$DEPLOY_SA"
          if [ "$DEPLOY_ENVIRONMENT" = production ]; then
            test -n "${{ vars.PUBLIC_BASE_URL }}"
            test -n "${{ vars.SLACK_TEAM_ID }}"
            test -n "${{ vars.SLACK_POSTING_CHANNEL_ID }}"
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
      - name: Build and push image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}" .
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}"
      - name: Remove legacy paid runtime resources
        run: |
          gcloud run services delete slack-scheduler --region "${GCP_REGION}" --quiet || true
          gcloud run jobs delete slack-scheduler-migrate --region "${GCP_REGION}" --quiet || true
          gcloud run jobs delete slack-scheduler-retention --region "${GCP_REGION}" --quiet || true
          gcloud compute networks vpc-access connectors delete ss-production --region "${GCP_REGION}" --quiet || true
      - name: Terraform apply — single VM architecture
        working-directory: infra/terraform
        env:
          GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT: ${{ vars.GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT || '{}' }}
        run: |
          terraform init -backend-config="bucket=${TERRAFORM_STATE_BUCKET}"
          terraform state rm \
            google_vpc_access_connector.run \
            google_cloud_run_v2_service.app \
            google_cloud_run_v2_job.migrate \
            google_cloud_run_v2_job.retention \
            google_compute_router_nat.private \
            google_compute_router.nat \
            google_compute_address.db \
            google_compute_instance.db \
            google_compute_disk.db_data \
            google_compute_firewall.postgres \
            google_cloud_scheduler_job.db_start \
            google_cloud_scheduler_job.app_start \
            google_cloud_scheduler_job.app_stop \
            google_cloud_scheduler_job.db_stop \
            google_cloud_scheduler_job.retention \
            google_service_account.scheduler \
            google_service_account.db \
            google_project_iam_member.scheduler_compute \
            google_project_iam_member.scheduler_run \
            google_project_iam_member.scheduler_invoker \
            google_service_account_iam_member.scheduler_service_agent_token_creator \
            google_secret_manager_secret_iam_member.db_password_access \
            || true
          args=(
            -var="project_id=${GCP_PROJECT_ID}"
            -var="environment=${DEPLOY_ENVIRONMENT}"
            -var="region=${GCP_REGION}"
            -var="github_repository=${{ github.repository }}"
            -var="container_image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}"
            -var="public_base_url=${{ vars.PUBLIC_BASE_URL }}"
            -var="slack_team_id=${{ vars.SLACK_TEAM_ID }}"
            -var="slack_posting_channel_id=${{ vars.SLACK_POSTING_CHANNEL_ID }}"
            -var="slack_recruitment_user_ids=${{ vars.SLACK_RECRUITMENT_USER_IDS }}"
            -var="slack_admin_user_ids=${{ vars.SLACK_ADMIN_USER_IDS }}"
            -var="slack_alert_user_ids=${{ vars.SLACK_ALERT_USER_IDS }}"
            -var="google_client_id=${{ vars.GOOGLE_CLIENT_ID }}"
            -var="google_redirect_uri=${{ vars.GOOGLE_REDIRECT_URI }}"
            -var="google_shared_calendar_id=${{ vars.GOOGLE_SHARED_CALENDAR_ID }}"
            -var="google_auth_slack_user_id=${{ vars.GOOGLE_AUTH_SLACK_USER_ID }}"
            -var="google_account_by_jazzhr_account=${GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT}"
            -var="billing_account_id=${{ vars.BILLING_ACCOUNT_ID || '' }}"
            -var="budget_amount=${{ vars.BUDGET_AMOUNT || '0' }}"
            -var="budget_currency_code=${{ vars.BUDGET_CURRENCY_CODE || 'AUD' }}"
          )
          terraform validate
          terraform apply -auto-approve "${args[@]}"
      - name: Verify application
        run: |
          for attempt in $(seq 1 30); do
            if gcloud compute ssh "slack-scheduler-${DEPLOY_ENVIRONMENT}-app" --zone "${GCP_REGION}-a" --tunnel-through-iap --quiet --ssh-flag=-batch --command="curl --fail --silent http://127.0.0.1:3000/health"; then exit 0; fi
            sleep 10
          done
          exit 1
