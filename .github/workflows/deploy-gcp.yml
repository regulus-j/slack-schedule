name: Deploy GCP

on:
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        options: [staging, production]
        required: true
  push:
    branches: [main]

permissions:
  contents: read
  id-token: write

concurrency:
  group: gcp-deploy-${{ inputs.environment || 'production' }}
  cancel-in-progress: false

jobs:
  deploy:
    environment: ${{ inputs.environment || 'production' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'production' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_REGION: ${{ vars.GCP_REGION }}
      TERRAFORM_STATE_BUCKET: ${{ vars.TERRAFORM_STATE_BUCKET }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Test and audit
        run: |
          npm ci
          npm test -- --test-timeout=30000 --test-concurrency=1
          node --check app.js
          npm audit --omit=dev --audit-level=moderate
      - name: Validate GCP authentication configuration
        env:
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_DEPLOY_SERVICE_ACCOUNT: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "::error::Set GCP_PROJECT_ID in the selected GitHub environment."; exit 1; }
          test -n "$GCP_REGION" || { echo "::error::Set GCP_REGION in the selected GitHub environment."; exit 1; }
          test -n "$TERRAFORM_STATE_BUCKET" || { echo "::error::Set TERRAFORM_STATE_BUCKET in the selected GitHub environment."; exit 1; }
          test -n "$GCP_WORKLOAD_IDENTITY_PROVIDER" || { echo "::error::Set GCP_WORKLOAD_IDENTITY_PROVIDER as an environment variable or secret."; exit 1; }
          test -n "$GCP_DEPLOY_SERVICE_ACCOUNT" || { echo "::error::Set GCP_DEPLOY_SERVICE_ACCOUNT as an environment variable or secret."; exit 1; }
      - name: Validate application startup configuration
        env:
          PUBLIC_BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          SLACK_TEAM_ID: ${{ vars.SLACK_TEAM_ID }}
          SLACK_POSTING_CHANNEL_ID: ${{ vars.SLACK_POSTING_CHANNEL_ID }}
          GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}
          GOOGLE_SHARED_CALENDAR_ID: ${{ vars.GOOGLE_SHARED_CALENDAR_ID }}
          GOOGLE_AUTH_SLACK_USER_ID: ${{ vars.GOOGLE_AUTH_SLACK_USER_ID }}
        run: |
          if [ "$DEPLOY_ENVIRONMENT" = "production" ]; then
            test -n "$PUBLIC_BASE_URL" || { echo "::error::Set PUBLIC_BASE_URL in the production GitHub environment."; exit 1; }
            test -n "$SLACK_TEAM_ID" || { echo "::error::Set SLACK_TEAM_ID in the production GitHub environment."; exit 1; }
            test -n "$SLACK_POSTING_CHANNEL_ID" || { echo "::error::Set SLACK_POSTING_CHANNEL_ID in the production GitHub environment."; exit 1; }
          fi
          if [ "$DEPLOY_ENVIRONMENT" = "production" ] && [ -n "$GOOGLE_CLIENT_ID" ] && [ -n "$GOOGLE_SHARED_CALENDAR_ID" ]; then
            test -n "$GOOGLE_AUTH_SLACK_USER_ID" || { echo "::error::Set GOOGLE_AUTH_SLACK_USER_ID in the production environment when Google Calendar is configured."; exit 1; }
          fi
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT || secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - uses: hashicorp/setup-terraform@v3
      - name: Bootstrap Artifact Registry
        working-directory: infra/terraform
        run: |
          terraform init -backend-config="bucket=${TERRAFORM_STATE_BUCKET}"
          terraform apply -auto-approve -target=google_artifact_registry_repository.app \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="environment=${DEPLOY_ENVIRONMENT}" \
            -var="region=${GCP_REGION}" \
            -var="github_repository=${{ github.repository }}" \
            -var="container_image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}"
      - name: Build and push image
        run: |
          gcloud auth configure-docker "${GCP_REGION}-docker.pkg.dev" --quiet
          docker build -t "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}" .
          docker push "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}"
      - name: Terraform plan
        working-directory: infra/terraform
        env:
          GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT: ${{ vars.GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT || '{}' }}
        run: |
          terraform plan \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="environment=${DEPLOY_ENVIRONMENT}" \
            -var="region=${GCP_REGION}" \
            -var="github_repository=${{ github.repository }}" \
            -var="container_image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}" \
            -var="public_base_url=${{ vars.PUBLIC_BASE_URL }}" \
            -var="slack_team_id=${{ vars.SLACK_TEAM_ID }}" \
            -var="slack_posting_channel_id=${{ vars.SLACK_POSTING_CHANNEL_ID }}" \
            -var="slack_recruitment_user_ids=${{ vars.SLACK_RECRUITMENT_USER_IDS }}" \
            -var="slack_admin_user_ids=${{ vars.SLACK_ADMIN_USER_IDS }}" \
            -var="slack_alert_user_ids=${{ vars.SLACK_ALERT_USER_IDS }}" \
            -var="google_client_id=${{ vars.GOOGLE_CLIENT_ID }}" \
            -var="google_redirect_uri=${{ vars.GOOGLE_REDIRECT_URI }}" \
            -var="google_shared_calendar_id=${{ vars.GOOGLE_SHARED_CALENDAR_ID }}" \
            -var="google_auth_slack_user_id=${{ vars.GOOGLE_AUTH_SLACK_USER_ID }}" \
            -var="google_account_by_jazzhr_account=${GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT}" \
            -var="monitoring_email=${{ vars.MONITORING_EMAIL }}" \
            -var="secret_next_rotation_time=${{ vars.SECRET_NEXT_ROTATION_TIME }}" \
            -var="recruiter_phone_export_url=${{ vars.RECRUITER_PHONE_EXPORT_URL }}" \
            -var="recruiter_phone_export_file_id=${{ vars.RECRUITER_PHONE_EXPORT_FILE_ID }}" \
            -var="recruiter_phone_export_sheet_name=${{ vars.RECRUITER_PHONE_EXPORT_SHEET_NAME }}" \
            -var="role_assignment_export_url=${{ vars.ROLE_ASSIGNMENT_EXPORT_URL }}" \
            -var="role_assignment_export_file_id=${{ vars.ROLE_ASSIGNMENT_EXPORT_FILE_ID }}" \
            -var="role_assignment_export_sheet_name=${{ vars.ROLE_ASSIGNMENT_EXPORT_SHEET_NAME }}" \
            -var="role_assignment_export_sheet_gid=${{ vars.ROLE_ASSIGNMENT_EXPORT_SHEET_GID }}" \
            -var="billing_account_id=${{ vars.BILLING_ACCOUNT_ID || '' }}" \
            -var="budget_amount=${{ vars.BUDGET_AMOUNT || '0' }}" \
            -var="budget_currency_code=${{ vars.BUDGET_CURRENCY_CODE || 'AUD' }}"
      - name: Terraform apply
        working-directory: infra/terraform
        env:
          GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT: ${{ vars.GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT || '{}' }}
        run: |
          terraform apply -auto-approve \
            -var="project_id=${GCP_PROJECT_ID}" \
            -var="environment=${DEPLOY_ENVIRONMENT}" \
            -var="region=${GCP_REGION}" \
            -var="github_repository=${{ github.repository }}" \
            -var="container_image=${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}" \
            -var="public_base_url=${{ vars.PUBLIC_BASE_URL }}" \
            -var="slack_team_id=${{ vars.SLACK_TEAM_ID }}" \
            -var="slack_posting_channel_id=${{ vars.SLACK_POSTING_CHANNEL_ID }}" \
            -var="slack_recruitment_user_ids=${{ vars.SLACK_RECRUITMENT_USER_IDS }}" \
            -var="slack_admin_user_ids=${{ vars.SLACK_ADMIN_USER_IDS }}" \
            -var="slack_alert_user_ids=${{ vars.SLACK_ALERT_USER_IDS }}" \
            -var="google_client_id=${{ vars.GOOGLE_CLIENT_ID }}" \
            -var="google_redirect_uri=${{ vars.GOOGLE_REDIRECT_URI }}" \
            -var="google_shared_calendar_id=${{ vars.GOOGLE_SHARED_CALENDAR_ID }}" \
            -var="google_auth_slack_user_id=${{ vars.GOOGLE_AUTH_SLACK_USER_ID }}" \
            -var="google_account_by_jazzhr_account=${GOOGLE_ACCOUNT_BY_JAZZHR_ACCOUNT}" \
            -var="monitoring_email=${{ vars.MONITORING_EMAIL }}" \
            -var="secret_next_rotation_time=${{ vars.SECRET_NEXT_ROTATION_TIME }}" \
            -var="recruiter_phone_export_url=${{ vars.RECRUITER_PHONE_EXPORT_URL }}" \
            -var="recruiter_phone_export_file_id=${{ vars.RECRUITER_PHONE_EXPORT_FILE_ID }}" \
            -var="recruiter_phone_export_sheet_name=${{ vars.RECRUITER_PHONE_EXPORT_SHEET_NAME }}" \
            -var="role_assignment_export_url=${{ vars.ROLE_ASSIGNMENT_EXPORT_URL }}" \
            -var="role_assignment_export_file_id=${{ vars.ROLE_ASSIGNMENT_EXPORT_FILE_ID }}" \
            -var="role_assignment_export_sheet_name=${{ vars.ROLE_ASSIGNMENT_EXPORT_SHEET_NAME }}" \
            -var="role_assignment_export_sheet_gid=${{ vars.ROLE_ASSIGNMENT_EXPORT_SHEET_GID }}" \
            -var="billing_account_id=${{ vars.BILLING_ACCOUNT_ID || '' }}" \
            -var="budget_amount=${{ vars.BUDGET_AMOUNT || '0' }}" \
            -var="budget_currency_code=${{ vars.BUDGET_CURRENCY_CODE || 'AUD' }}"
      - name: Deploy callback service and application VM
        run: |
          IMAGE="${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/slack-scheduler-image/app:${{ github.sha }}"
          DB_INSTANCE="slack-scheduler-${DEPLOY_ENVIRONMENT}-db"
          APP_INSTANCE="slack-scheduler-${DEPLOY_ENVIRONMENT}-app"
          DB_STATUS=$(gcloud compute instances describe "${DB_INSTANCE}" \
            --zone "${GCP_REGION}-a" --format='value(status)')
          if [ "${DB_STATUS}" != "RUNNING" ]; then
            gcloud compute instances start "${DB_INSTANCE}" \
            --zone "${GCP_REGION}-a" --quiet
          fi
          for attempt in $(seq 1 24); do
            if gcloud compute ssh "${DB_INSTANCE}" --zone "${GCP_REGION}-a" --tunnel-through-iap --quiet \
              --command="sudo -u postgres pg_isready -d scheduler"; then
              break
            fi
            test "${attempt}" -lt 24 || { echo "::error::PostgreSQL did not become ready."; exit 1; }
            sleep 10
          done
          gcloud run deploy slack-scheduler --region "${GCP_REGION}" --image "${IMAGE}" --quiet
          gcloud run jobs execute slack-scheduler-migrate --region "${GCP_REGION}" --wait
          APP_STATUS=$(gcloud compute instances describe "${APP_INSTANCE}" \
            --zone "${GCP_REGION}-a" --format='value(status)')
          if [ "${APP_STATUS}" = "RUNNING" ]; then
            gcloud compute instances stop "${APP_INSTANCE}" --zone "${GCP_REGION}-a" --quiet
          fi
          gcloud compute instances start "${APP_INSTANCE}" --zone "${GCP_REGION}-a" --quiet
          for attempt in $(seq 1 30); do
            if response=$(gcloud compute ssh "${APP_INSTANCE}" --zone "${GCP_REGION}-a" --tunnel-through-iap --quiet \
              --command="curl --fail --silent http://127.0.0.1:3000/health"); then
              echo "${response}"
              break
            fi
            test "${attempt}" -lt 30 || { echo "::error::Application VM health check did not become ready."; exit 1; }
            sleep 10
          done
          URL=$(gcloud run services describe slack-scheduler --region "${GCP_REGION}" --format='value(status.url)')
          echo "Deployed callback service ${IMAGE} to ${URL}; application VM is ${APP_INSTANCE}"
